<table id="peaks-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nazwa</th>
        <th>Wysokość</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="data : ${dataList}" class="table-row" data-id="${data.id}" th:class="'point-'+${data.id}">
        <td th:text="${data.id}"></td>
        <td th:text="${data.name}"></td>
        <td th:text="${data.height}"></td>
    </tr>
    </tbody>
</table>
